{{/* login: the owner's passphrase (ADR 0009). One field; a wrong
     passphrase says so and nothing more. */}}
{{define "title"}}{{t "login.title"}}{{end}}
{{define "content"}}
<section class="slot narrow">
  <h1>{{t "login.h"}}</h1>
  {{if .Error}}<p class="error" role="alert">{{.Error}}</p>{{end}}
  <form method="post" action="/login" class="newcard">
    <label for="pw">{{t "login.label"}}</label>
    <input id="pw" name="password" type="password" autocomplete="current-password" required>
    <button type="submit">{{t "login.submit"}}</button>
  </form>
</section>
{{end}}
